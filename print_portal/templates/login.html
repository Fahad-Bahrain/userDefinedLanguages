<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKK Print Portal — Login</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

<div class="login-bg"></div>

<div class="login-wrap">
  <div class="login-card">

    <!-- Left panel: logo + title -->
    <div class="login-left">
      <img src="/logo" alt="Ekkanoo" class="login-ekk-logo"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-circle',textContent:'EKK'}))">
      <h1>Oracle Print Portal</h1>
      <p class="subtitle">Printer Queue Management</p>
    </div>

    <div class="login-divider"></div>

    <!-- Right panel: form -->
    <div class="login-right">
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login" autocomplete="off">
        <div class="form-row">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Username" autofocus required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Password" required>
          </div>
          <button type="submit" class="btn-login">Sign In</button>
        </div>
      </form>

      <p class="login-footer">Ebrahim K. Kanoo &bull; Bahrain &bull; IT Department</p>
    </div>

  </div>
</div>

</body>
</html>
