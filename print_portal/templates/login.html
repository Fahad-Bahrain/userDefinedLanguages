<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKK Print Portal — Login</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

<div class="login-bg"></div>

<div class="login-wrap">
  <div class="login-card">

    <!-- Blue header section -->
    <div class="card-header">
      <div class="logo-box">
        <img src="/logo" alt="Ekkanoo" class="login-ekk-logo"
             onerror="this.parentElement.replaceWith(Object.assign(document.createElement('div'),{className:'logo-circle',textContent:'EKK'}))">
      </div>
      <h1>Oracle Print Portal</h1>
      <p class="subtitle">Printer Queue Management</p>
    </div>

    <!-- Form section -->
    <div class="card-body">
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login" autocomplete="off">
        <div class="field-row">
          <span class="field-label">Username</span>
          <input type="text" name="username" placeholder="Enter your username" autofocus required>
        </div>
        <div class="field-row">
          <span class="field-label">Password</span>
          <input type="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <p class="login-footer">Ebrahim K. Kanoo &bull; Bahrain &bull; IT Department</p>
    </div>

  </div>
</div>

<div class="login-version">&copy; Ebrahim K. Kanoo &mdash; Bahrain &ndash; IT Department &nbsp;|&nbsp; {{ version }}</div>

</body>
</html>
